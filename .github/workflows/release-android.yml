name: Android Build & Auto-Update Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-release-android:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@3a5042881c46ac69ea7629d5369e7b18bf23db7c # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Build Android Release APK
        run: |
          cd VachanamAndroid
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact & Compute SHA-256
        id: checksum
        run: |
          mkdir -p dist
          cp VachanamAndroid/app/build/outputs/apk/release/app-release.apk dist/Vachanam-Android.apk
          cd dist
          sha256sum Vachanam-Android.apk > Vachanam-Android.apk.sha256
          SHA=$(awk '{print $1}' Vachanam-Android.apk.sha256)
          echo "APK_SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "Computed SHA-256: $SHA"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@65462800fdff703dbfb60284bfaa4e09f75a1a5 # v4.5.0
        with:
          name: Vachanam-Android-APK
          path: |
            dist/Vachanam-Android.apk
            dist/Vachanam-Android.apk.sha256

      - name: Generate Automatic Release Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@c95414830ceb0b4650f81d5b1282c02641338449 # v2.2.1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: "Vachanam Release ${{ steps.tag_gen.outputs.TAG_NAME }}"
          body: |
            Automated over-the-air update release for Vachanam.
            
            ### Changes in this build
            - Commit: ${{ github.sha }}
            - Ref: ${{ github.ref }}
            
            ### Verification Checksum (SHA-256)
            ```text
            ${{ steps.checksum.outputs.APK_SHA256 }}  Vachanam-Android.apk
            ```
            
            ### How to Auto-Update on Android
            - If you use **Obtainium**: Updates will be detected and installed automatically on your device.
            - Direct download: Download `Vachanam-Android.apk` below and open it to update.
          files: |
            dist/Vachanam-Android.apk
            dist/Vachanam-Android.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
