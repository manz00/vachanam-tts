name: Android Build & Auto-Update Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Build Android Release APK
        run: |
          set -eo pipefail
          cd VachanamAndroid
          if ! ./gradlew assembleRelease -x lint -x lintVitalRelease --stacktrace --no-daemon 2>&1 | tee ../build.log; then
            echo "::error title=Gradle Build Failed::$(grep -E -A 4 -B 1 'e: |FAILURE:|ERROR:|Caused by:' ../build.log | head -n 12 | tr '\n' ' ' | sed 's/\"//g')"
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Prepare APK Artifact & Compute SHA-256
        id: checksum
        run: |
          mkdir -p dist
          find . -name "*.apk" -ls || true
          APK_SRC=$(find VachanamAndroid/app/build/outputs -name "*.apk" -not -name "*androidTest*" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find . -name "*.apk" -not -name "*androidTest*" | head -n 1)
          fi
          if [ -z "$APK_SRC" ]; then
            echo "Error: No APK found in build outputs!"
            exit 1
          fi
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" dist/Vachanam-Android.apk
          cd dist
          sha256sum Vachanam-Android.apk > Vachanam-Android.apk.sha256
          SHA=$(awk '{print $1}' Vachanam-Android.apk.sha256)
          echo "APK_SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "Computed SHA-256: $SHA"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vachanam-Android-APK
          path: |
            dist/Vachanam-Android.apk
            dist/Vachanam-Android.apk.sha256

      - name: Generate Automatic Release Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: "Vachanam Release ${{ steps.tag_gen.outputs.TAG_NAME }}"
          body: |
            Automated over-the-air update release for Vachanam.
            
            ### Changes in this build
            - Commit: ${{ github.sha }}
            - Ref: ${{ github.ref }}
            
            ### Verification Checksum (SHA-256)
            ```text
            ${{ steps.checksum.outputs.APK_SHA256 }}  Vachanam-Android.apk
            ```
            
            ### How to Auto-Update on Android
            - If you use **Obtainium**: Updates will be detected and installed automatically on your device.
            - Direct download: Download `Vachanam-Android.apk` below and open it to update.
          files: |
            dist/Vachanam-Android.apk
            dist/Vachanam-Android.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
