name: Android Build & Auto-Update Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Build Android Release APK
        run: |
          cd VachanamAndroid
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Starting assembleRelease..."
          ./gradlew assembleRelease --stacktrace --no-daemon > build_output.txt 2>&1 || BUILD_STATUS=$?
          if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
            ERR_MSG=$(grep -i -E '(^e: |error: |compilation error)' build_output.txt | head -n 3 | tr '\n' ' ' | sed 's/\"//g' | cut -c 1-250)
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(grep -E 'Caused by:' build_output.txt | head -n 3 | tr '\n' ' ' | sed 's/\"//g' | cut -c 1-250)
            fi
            echo "::error title=Kotlin Compilation Failed::$ERR_MSG"
            echo "====== BUILD OUTPUT TAIL (100 lines) ======"
            tail -n 100 build_output.txt
            echo "==========================================="
            exit $BUILD_STATUS
          fi
          echo "assembleRelease succeeded!"

      - name: Prepare APK Artifact & Compute SHA-256
        id: checksum
        run: |
          mkdir -p dist
          echo "Scanning workspace for generated APK files..."
          find . -name "*.apk" || true
          APK_SRC=$(find . -name "*release*.apk" -not -name "*androidTest*" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find . -name "*.apk" -not -name "*androidTest*" | head -n 1)
          fi
          if [ -z "$APK_SRC" ]; then
            echo "Error: No APK found anywhere in workspace!"
            find VachanamAndroid -maxdepth 4 -ls || true
            exit 1
          fi
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" dist/Vachanam-Android.apk
          SHA=$(sha256sum dist/Vachanam-Android.apk | awk '{print $1}')
          echo "$SHA  Vachanam-Android.apk" > dist/Vachanam-Android.apk.sha256
          echo "APK_SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "Computed SHA-256: $SHA"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vachanam-Android-APK
          path: |
            dist/Vachanam-Android.apk
            dist/Vachanam-Android.apk.sha256

      - name: Generate Automatic Release Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag_gen.outputs.TAG_NAME }}
          APK_SHA256: ${{ steps.checksum.outputs.APK_SHA256 }}
        run: |
          cat << 'EOF' > release_body.md
          Automated over-the-air update release for Vachanam.

          ### Changes in this build
          - Commit: ${{ github.sha }}
          - Ref: ${{ github.ref }}

          ### Verification Checksum (SHA-256)
          ```text
          EOF
          echo "${APK_SHA256}  Vachanam-Android.apk" >> release_body.md
          cat << 'EOF' >> release_body.md
          ```

          ### How to Auto-Update on Android
          - If you use **Obtainium**: Updates will be detected and installed automatically on your device.
          - Direct download: Download `Vachanam-Android.apk` below and open it to update.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/Vachanam-Android.apk dist/Vachanam-Android.apk.sha256 --clobber
            gh release edit "$TAG_NAME" --title "Vachanam Release $TAG_NAME" --notes-file release_body.md
          else
            gh release create "$TAG_NAME" dist/Vachanam-Android.apk dist/Vachanam-Android.apk.sha256 \
              --title "Vachanam Release $TAG_NAME" \
              --notes-file release_body.md \
              --generate-notes
          fi
