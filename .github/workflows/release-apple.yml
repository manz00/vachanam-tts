name: Apple Build & Release (macOS & TestFlight)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apple:
    name: Build Mac Catalyst & Apple Release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || true

      - name: Regenerate Xcode Project
        run: |
          cd VachanamApple
          python3 generate_project.py

      - name: Build Mac Catalyst App (Release)
        run: |
          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Mac Catalyst Application & Compute SHA-256
        id: checksum
        run: |
          mkdir -p dist
          APP_PATH=$(find ./DerivedData -name "Vachanam.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r -y "${GITHUB_WORKSPACE}/dist/Vachanam-MacCatalyst.zip" "Vachanam.app"
            cd "${GITHUB_WORKSPACE}/dist"
            shasum -a 256 Vachanam-MacCatalyst.zip > Vachanam-MacCatalyst.zip.sha256
            SHA=$(awk '{print $1}' Vachanam-MacCatalyst.zip.sha256)
            echo "MAC_SHA256=$SHA" >> $GITHUB_OUTPUT
            echo "Computed SHA-256: $SHA"
            cd "${GITHUB_WORKSPACE}"
          else
            echo "Warning: Vachanam.app not found in DerivedData"
          fi

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('dist/Vachanam-MacCatalyst.zip') != ''
        with:
          name: Vachanam-MacCatalyst
          path: |
            dist/Vachanam-MacCatalyst.zip
            dist/Vachanam-MacCatalyst.zip.sha256

      - name: Generate Automatic Release Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Attach macOS App to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && hashFiles('dist/Vachanam-MacCatalyst.zip') != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: "Vachanam Release ${{ steps.tag_gen.outputs.TAG_NAME }}"
          body: |
            Automated over-the-air update release for Vachanam (macOS / Mac Catalyst).
            
            ### Changes in this build
            - Commit: ${{ github.sha }}
            - Ref: ${{ github.ref }}
            
            ### Verification Checksum (SHA-256)
            ```text
            ${{ steps.checksum.outputs.MAC_SHA256 }}  Vachanam-MacCatalyst.zip
            ```
          files: |
            dist/Vachanam-MacCatalyst.zip
            dist/Vachanam-MacCatalyst.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      # -------------------------------------------------------------
      # Automated iOS / iPadOS TestFlight Deployment (Optional Step)
      # -------------------------------------------------------------
      # To enable automatic OTA background updates on your iPad/iPhone:
      # 1. Add secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_BASE64
      # 2. Add provisioning profile and Apple distribution certificate secrets.
      # 3. Uncomment this block to automatically archive and upload to TestFlight.
      # -------------------------------------------------------------
