name: Build & Publish Release (Android & Mac)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Build Android Release APK
        run: |
          cd VachanamAndroid
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Stage Android APK & Compute Checksum
        run: |
          mkdir -p dist
          APK_SRC=$(find VachanamAndroid -name "*release*.apk" -not -name "*androidTest*" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find VachanamAndroid -name "*.apk" -not -name "*androidTest*" | head -n 1)
          fi
          cp "$APK_SRC" dist/Vachanam-Android.apk
          cd dist
          sha256sum Vachanam-Android.apk > Vachanam-Android.apk.sha256

      - name: Upload Android Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-package
          path: |
            dist/Vachanam-Android.apk
            dist/Vachanam-Android.apk.sha256

  build-apple:
    name: Build Mac Catalyst App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || true

      - name: Regenerate Xcode Project
        run: |
          cd VachanamApple
          python3 generate_project.py

      - name: Build Mac Catalyst App (Release)
        run: |
          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Mac Catalyst App & Compute Checksum
        run: |
          mkdir -p dist
          APP_PATH=$(find ./DerivedData -name "Vachanam.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r -y "${GITHUB_WORKSPACE}/dist/Vachanam-MacCatalyst.zip" "Vachanam.app"
            cd "${GITHUB_WORKSPACE}/dist"
            shasum -a 256 Vachanam-MacCatalyst.zip > Vachanam-MacCatalyst.zip.sha256
          fi

      - name: Upload Apple Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-release-package
          path: |
            dist/Vachanam-MacCatalyst.zip
            dist/Vachanam-MacCatalyst.zip.sha256

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Android Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: android-release-package
          path: dist

      - name: Download Apple Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: apple-release-package
          path: dist

      - name: Determine Release Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag_gen.outputs.TAG_NAME }}
        run: |
          cat << 'EOF' > release_body.md
          ## Vachanam Precompiled Packages

          Automated universal build for Android and Apple (Mac Catalyst).

          ### 📦 Download Packages
          - 🤖 **Android APK**: [`Vachanam-Android.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_gen.outputs.TAG_NAME }}/Vachanam-Android.apk)
          - 🍏 **macOS App**: [`Vachanam-MacCatalyst.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_gen.outputs.TAG_NAME }}/Vachanam-MacCatalyst.zip)

          ### 🔒 Verification Checksums (SHA-256)
          ```text
          EOF
          cat dist/*.sha256 >> release_body.md 2>/dev/null || true
          cat << 'EOF' >> release_body.md
          ```

          ### 🔄 Over-the-Air Auto-Updates
          - **Android (Obtainium)**: Add `https://github.com/${{ github.repository }}` in Obtainium to receive background auto-updates.
          - **Manual**: Download and install the latest APK or Mac zip anytime from this release.
          EOF

          FILES=(dist/Vachanam-Android.apk dist/Vachanam-Android.apk.sha256 dist/Vachanam-MacCatalyst.zip dist/Vachanam-MacCatalyst.zip.sha256)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
            gh release edit "$TAG_NAME" --title "Vachanam Release $TAG_NAME" --notes-file release_body.md
          else
            gh release create "$TAG_NAME" "${FILES[@]}" \
              --title "Vachanam Release $TAG_NAME" \
              --notes-file release_body.md \
              --generate-notes
          fi
