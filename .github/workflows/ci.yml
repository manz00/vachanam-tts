name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-apple:
    name: Apple Tests (Mac Catalyst & Unit Tests)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Latest Xcode 16
        run: |
          ls -la /Applications | grep -i Xcode || true
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Regenerate Xcode Project
        run: |
          cd VachanamApple
          python3 generate_project.py

      - name: Build Mac Catalyst App
        run: |
          set +e
          echo "### 📱 Available Destinations on Runner" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          xcodebuild -project VachanamApple/Vachanam.xcodeproj -scheme Vachanam -showdestinations 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath ./DerivedData/MacCatalyst \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -skipPackageSignatureValidation \
            -packageFingerprintPolicy warn \
            -packageSigningEntityPolicy warn \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build > /tmp/xcodebuild_ci.log 2>&1
          BUILD_STATUS=$?
          echo "xcodebuild finished with exit status: $BUILD_STATUS"
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::xcodebuild failed with exit status $BUILD_STATUS"
            echo "### ❌ Xcodebuild Build Log (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/xcodebuild_ci.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 /tmp/xcodebuild_ci.log
            exit $BUILD_STATUS
          fi
          set -e

      - name: Run Unit Tests (iOS Simulator)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPad|iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            echo "Booting iOS Simulator ($DEVICE_ID)..."
            xcrun simctl boot "$DEVICE_ID" || true
            DEST="id=$DEVICE_ID"
          else
            DEST="platform=iOS Simulator,OS=latest,name=iPhone 16"
          fi
          echo "Testing with destination: $DEST"
          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -destination "$DEST" \
            -only-testing:VachanamTests \
            -derivedDataPath ./DerivedData/Simulator \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -skipPackageSignatureValidation \
            -packageFingerprintPolicy warn \
            -packageSigningEntityPolicy warn \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/xcodebuild_test.log || { echo "=== TESTS FAILED ==="; tail -n 120 /tmp/xcodebuild_test.log; exit 1; }

  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Run Android Unit Tests
        run: |
          cd VachanamAndroid
          if ! ./gradlew testDebugUnitTest --continue --no-daemon 2>&1 | tee ../unit_tests.log; then
            echo "::error title=Unit Tests Failed::$(grep -E -A 4 -B 1 'e: |FAILURE:|ERROR:|FAILED' ../unit_tests.log | head -n 12 | tr '\n' ' ')"
            exit 1
          fi
