name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-apple:
    name: Apple Tests (Mac Catalyst & Unit Tests)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Latest Xcode
        run: |
          echo "=== Available Xcode installations ==="
          ls -d /Applications/Xcode* || true
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version

      - name: Regenerate Xcode Project
        run: |
          cd VachanamApple
          python3 generate_project.py

      - name: Build Mac Catalyst App
        run: |
          set -o pipefail
          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath ./DerivedData/MacCatalyst \
            -clonedSourcePackagesDirPath ./DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -skipPackageSignatureValidation \
            -packageFingerprintPolicy warn \
            -packageSigningEntityPolicy warn \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee /tmp/xcodebuild_build.log || {
              EXIT_CODE=$?
              echo "::error title=Xcodebuild Failed::$(grep -E 'error:|fatal:' /tmp/xcodebuild_build.log | tail -n 10 | tr '\n' ' ')"
              exit $EXIT_CODE
            }

      - name: Run Unit Tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPad|iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            echo "Booting iOS Simulator ($DEVICE_ID)..."
            xcrun simctl boot "$DEVICE_ID" || true
            DEST="id=$DEVICE_ID"
          else
            DEST="platform=iOS Simulator,OS=latest,name=iPhone 16"
          fi
          echo "Testing with destination: $DEST"
          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -destination "$DEST" \
            -only-testing:VachanamTests \
            -derivedDataPath ./DerivedData/Simulator \
            -clonedSourcePackagesDirPath ./DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -skipPackageSignatureValidation \
            -packageFingerprintPolicy warn \
            -packageSigningEntityPolicy warn \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/xcodebuild_test.log || {
              EXIT_CODE=$?
              echo "::error title=iOS Tests Failed::$(grep -E 'error:|fatal:|failed' /tmp/xcodebuild_test.log | tail -n 10 | tr '\n' ' ')"
              exit $EXIT_CODE
            }

  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Run Android Unit Tests
        run: |
          cd VachanamAndroid
          if ! ./gradlew testDebugUnitTest --continue --no-daemon 2>&1 | tee ../unit_tests.log; then
            echo "::error title=Unit Tests Failed::$(grep -E -A 4 -B 1 'e: |FAILURE:|ERROR:|FAILED' ../unit_tests.log | head -n 12 | tr '\n' ' ')"
            exit 1
          fi
