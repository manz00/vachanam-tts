name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-apple:
    name: Apple Tests (Mac Catalyst & Unit Tests)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || true

      - name: Regenerate Xcode Project
        run: |
          cd VachanamApple
          python3 generate_project.py

      - name: Run Mac Catalyst Tests
        run: |
          xcodebuild -project VachanamApple/Vachanam.xcodeproj \
            -scheme Vachanam \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -only-testing:VachanamTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -quiet test

  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x VachanamAndroid/gradlew

      - name: Run Android Unit Tests
        run: |
          cd VachanamAndroid
          if ! ./gradlew testDebugUnitTest --continue --no-daemon 2>&1 | tee ../unit_tests.log; then
            echo "::error title=Unit Tests Failed::$(grep -E -A 4 -B 1 'e: |FAILURE:|ERROR:|FAILED' ../unit_tests.log | head -n 12 | tr '\n' ' ')"
            exit 1
          fi
